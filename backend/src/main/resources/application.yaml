spring:
  application:
    name: eco-monitoring-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eco_monitoring
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 30
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-change-me-32b}
    expiration-ms: 86400000
  collector:
    cron: "0 0 * * * *"     # каждый час
    enabled: true
  cors:
    allowed-origins: "http://localhost:5173"