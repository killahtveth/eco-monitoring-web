spring:
  application:
    name: eco-monitoring-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eco_monitoring
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

